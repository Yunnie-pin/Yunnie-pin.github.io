<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yunnie-pin | Simple Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            orangebg: '#fff3e0',
            orangecard: '#fff8f1',
            orange: '#fb923c',
            orangehover: '#ea580c',
            orangetext: '#b45309',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center transition-colors duration-300 bg-orangebg text-orangetext dark:bg-zinc-900 dark:text-zinc-100">
  <button id="toggleMode" aria-label="Toggle dark/light mode"
    class="fixed top-6 right-6 z-10 rounded-full px-4 py-2 font-medium text-lg transition-colors duration-300 bg-orange text-white hover:bg-orangehover dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700">
    🌙
  </button>
  <div id="profile" class="w-full max-w-xs text-center rounded-2xl shadow-xl p-8 bg-orangecard dark:bg-zinc-800 transition-colors duration-300">
    <p>Loading profile...</p>
  </div>
  <script>
    // Theme toggle logic with Tailwind
    const toggleBtn = document.getElementById('toggleMode');
    function setTheme(mode) {
      const html = document.documentElement;
      if (mode === 'dark') {
        html.classList.add('dark');
        toggleBtn.textContent = '☀️';
      } else {
        html.classList.remove('dark');
        toggleBtn.textContent = '🌙';
      }
      localStorage.setItem('theme', mode);
    }
    // Load theme from localStorage
    const savedTheme = localStorage.getItem('theme');
    setTheme(savedTheme === 'dark' ? 'dark' : 'light');
    toggleBtn.onclick = () => {
      const isDark = document.documentElement.classList.contains('dark');
      setTheme(isDark ? 'light' : 'dark');
    };
    // Fetch profile
    fetch('https://api.github.com/users/Yunnie-pin')
      .then(res => res.json())
      .then(data => {
        document.getElementById('profile').innerHTML = `
          <img class="avatar mx-auto w-24 h-24 rounded-full mb-4 border-2 border-orange object-cover bg-zinc-900 dark:border-zinc-700 dark:bg-zinc-900" src="${data.avatar_url}" alt="Avatar">
          <div class="name text-2xl font-semibold mb-2">${data.name || data.login}</div>
          <div class="bio text-base mb-4">${data.bio || ''}</div>
          <a class="github-link text-orange hover:text-orangehover font-medium transition-colors dark:text-orange dark:hover:text-orangehover" href="${data.html_url}" target="_blank">@${data.login}</a>
        `;
      })
      .catch(() => {
        document.getElementById('profile').innerHTML = '<p>Failed to load profile.</p>';
      });
  </script>
</body>
</html>
